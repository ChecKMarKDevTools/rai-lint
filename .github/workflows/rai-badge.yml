name: RAI Attribution

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  score:
    name: Score and publish the badge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # the whole history is the input; a shallow clone hard-fails
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: anchildress1/rai-commit-badge@4116096f0a33a6ac8bf3daafcd239fa548328e99
        with:
          style: for-the-badge
          token: ${{ github.token }}
